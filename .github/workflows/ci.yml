name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with dist/*.whl tests/check_wheel.py

      - name: Upload the package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The one required status check for main: it passes only when every matrix job passed, so the matrix can change
  # without editing the ruleset. `always()` makes it run (and fail) when a matrix job fails, instead of being skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: All matrix jobs passed
        run: test "${{ needs.test-and-build.result }}" = "success"
