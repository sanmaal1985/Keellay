name: CI

# Pull requests only: main requires the branch to be up to date before a merge, so the squash commit has the tree
# that was tested; a run after the merge would test it again.
on:
  pull_request:
    # `edited` re-checks the title and description when someone changes them; the whole run repeats, so ci-ok
    # never reports success without the tests of that run.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with dist/*.whl tests/check_wheel.py

      - name: Upload the package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Main is squash-merged with the PR title and description as the commit message: fix the title to
  # `<type>: <summary>`, build an empty description from the commits, drop AI attribution lines, wrap the description
  # at 72, require the bugfix triple on fix/ branches.
  # Edits made with GITHUB_TOKEN start no new workflow run, so this does not loop.
  pr-message:
    name: PR title and description
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fix the title and description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_message.py

  # Keellay checks its own specs, deltas and method with the command it ships, as every project does.
  check:
    name: keellay check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Check
        run: uv run keellay check

  # The one required status check for main: it passes only when every matrix job passed, the PR message is fine and
  # the project's checks pass, so jobs can change without editing the ruleset. `always()` makes it run (and fail) when
  # a job fails, instead of being skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test-and-build, pr-message, check]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.test-and-build.result }}" = "success"
          test "${{ needs.pr-message.result }}" = "success"
          test "${{ needs.check.result }}" = "success"
