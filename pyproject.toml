[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keellay"
version = "0.0.0"
description = "Vendor-agnostic spec-driven development framework for projects built with AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Keellay authors" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.4",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
keellay = "keellay.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keellay"]

# The method lives at the repository root so it can be read on GitHub; the wheel carries it inside the package.
[tool.hatch.build.targets.wheel.force-include]
"method" = "keellay/method"

[tool.hatch.build.targets.sdist]
include = ["src", "method", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ruff is pinned above, so a new release cannot fail CI on code that has not changed.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-include = [".github/scripts/*.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify, pathlib, ruff's own, comprehensions,
# misc, returns.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "C4", "PIE", "RET"]
